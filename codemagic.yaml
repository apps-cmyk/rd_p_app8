# Definitions and workflows
definitions:
  common_scripts: &common_scripts
    name: Install npm dependencies
    script: |
      npm install

  ios_environment: &ios_environment
    ios_signing:
      distribution_type: app_store
      bundle_identifier: com.noir.scarlet99
    vars:
      XCODE_WORKSPACE: "app_rd_13_p_1.xcworkspace"
      XCODE_SCHEME: "app_rd_13_p_1"
      APP_STORE_APP_ID: 6757937669
      BUILD_ENV: production
    node: 18
    xcode: latest
    cocoapods: default

  ios_base: &ios_base
    max_build_duration: 120
    instance_type: mac_mini_m4
    integrations:
      app_store_connect: rd_app_13_p_1 app store connect api key
    scripts:
      - *common_scripts
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          cd ios
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$CM_BUILD_OUTPUT_DIR"
    artifacts:
      - $CM_BUILD_OUTPUT_DIR/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true

workflows:
  # ----------------------------
  # iOS White
  # ----------------------------
  ios_white:
    <<: *ios_base
    name: iOS White
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white
          include: true
    environment:
      <<: *ios_environment
      vars:
        XCODE_WORKSPACE: "app_rd_13_p_1.xcworkspace" # Example: "app_rd_13_p_1.xcworkspace"
        XCODE_SCHEME: "app_rd_13_p_1" # Example: "app_rd_13_p_1"
        APP_STORE_APP_ID: 6757937669 # Example: 6757937669
        BUILD_ENV: production
        APP_FLAVOR: ios-white

  # ----------------------------
  # iOS Black
  # ----------------------------
  ios_black:
    <<: *ios_base
    name: iOS Black
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-black
          include: true
    environment:
      <<: *ios_environment
      vars:
        XCODE_WORKSPACE: "app_rd_13_p_1.xcworkspace" # Example: "app_rd_13_p_1.xcworkspace"
        XCODE_SCHEME: "app_rd_13_p_1" # Example: "app_rd_13_p_1"
        APP_STORE_APP_ID: 6757937669 # Example: 6757937669
        BUILD_ENV: production
        APP_FLAVOR: ios-black

  # ----------------------------
  # Android Black
  # ----------------------------
  android_black:
    name: Android Black
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: android-black
          include: true
    environment:
      android_signing:
        - codemagic_keystore # Reference name from Codemagic dashboard
      vars:
        APP_FLAVOR: android-black
        BUILD_ENV: production
        PACKAGE_NAME: "com.noir.scarlet" # Example: com.your.app.package
      node: 18
      java: 17
    scripts:
      - *common_scripts
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android Black
        script: |
          cd android
          ./gradlew bundleRelease assembleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
